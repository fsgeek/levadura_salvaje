[project]
name = "levadura-salvaje"
version = "0.1.0"
description = "Bounded minds. Unbounded evidence. Wild fermentation."
readme = "README.md"
authors = [
    { name = "Tony Mason", email = "fsgeek@gatech.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "opentimestamps-client>=0.7.2",
]

[project.scripts]
levadura-salvaje = "levadura_salvaje:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
